name: Enviar lembretes BSA

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos
  workflow_dispatch: {}

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: cd scripts && npm install

      - name: Publicar credencial de serviço
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/bsa-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Enviar lembretes pendentes
        run: node scripts/enviar-lembretes.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/bsa-service-account.json
