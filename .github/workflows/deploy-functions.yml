name: Publicar Cloud Functions do BSA

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências da função
        run: cd functions && npm install

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar credencial de serviço
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/bsa-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy das Cloud Functions
        run: |
          set +e
          firebase deploy --only functions --project bsa-app-493c3 --non-interactive --debug > /tmp/deploy.log 2>&1
          STATUS=$?
          echo "## Resultado do deploy (status $STATUS)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -c 5000 /tmp/deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $STATUS
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/bsa-service-account.json
