name: Publicar Cloud Functions do BSA

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências da função
        run: cd functions && npm install

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar credencial de serviço
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/bsa-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy das Cloud Functions
        id: deploy
        run: |
          set +e
          firebase deploy --only functions --project bsa-app-493c3 --non-interactive --debug > /tmp/deploy.log 2>&1
          echo "STATUS=$?" >> $GITHUB_ENV
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/bsa-service-account.json

      - name: Salvar log de diagnóstico no repositório
        if: always()
        run: |
          mkdir -p debug
          cp /tmp/deploy.log debug/last-deploy-log.txt
          git config user.name "bsa-bot"
          git config user.email "bsa-bot@users.noreply.github.com"
          git add debug/last-deploy-log.txt
          git commit -m "Log de diagnostico do deploy (auto)" || echo "nada pra commitar"
          git push

      - name: Falhar o job se o deploy falhou
        if: always()
        run: exit ${STATUS:-1}
